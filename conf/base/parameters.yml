# Parámetros del pipeline ETL NHANES
# Documentación: https://docs.kedro.org/en/stable/configure/parameters/

# --- Selección de columnas por archivo (renombradas en processing) ---
columns:
  demographics: [SEQN, RIAGENDR, RIDAGEYR, RIDRETH3, DMDEDUC2, INDFMPIR]
  body_measures: [SEQN, BMXBMI, BMXWT, BMXHT, BMXWAIST]
  diet: [SEQN, DR1TKCAL, DR1TSUGR, DR1TSODI, DR1TTFAT, DR1TSFAT, DR1TFIBE, DR1TPROT, DR1TCARB]
  blood_pressure: [SEQN, BPXOSY1, BPXOSY2, BPXOSY3, BPXODI1, BPXODI2, BPXODI3]
  glucose: [SEQN, LBXGLU]
  hba1c: [SEQN, LBXGH]
  cholesterol_total: [SEQN, LBXTC]
  cholesterol_hdl: [SEQN, LBDHDD]
  triglycerides: [SEQN, LBXTR, LBDLDL]
  diabetes_q: [SEQN, DIQ010]
  bloodpressure_q: [SEQN, BPQ020]
  smoking_q: [SEQN, SMQ020]
  activity_q: [SEQN, PAQ650]

# --- Reglas de feature engineering / umbrales clínicos ---
thresholds:
  bmi:
    underweight: 18.5
    normal: 25.0
    overweight: 30.0
  hypertension_systolic: 130   # mmHg (ACC/AHA)
  hypertension_diastolic: 80   # mmHg
  diabetes_fasting_glucose: 126  # mg/dL
  diabetes_hba1c: 6.5          # %
  age_groups:
    - {label: "18-29", min: 18, max: 29}
    - {label: "30-44", min: 30, max: 44}
    - {label: "45-64", min: 45, max: 64}
    - {label: "65+",   min: 65, max: 150}

# --- Modelo de ML: clasificación binaria de alto riesgo cardiometabólico ---
model:
  target_col: cardiometabolic_risk
  target_threshold: 2   # score >= 2 -> alto riesgo (1); de lo contrario bajo (0)
  features:
    - bmi
    - bp_systolic_mean
    - bp_diastolic_mean
    - glucose_mgdl
    - hba1c_pct
    - age
  test_size: 0.2
  random_state: 42
  n_estimators: 200
  max_depth: 8

# --- Modelo de ML: edad biológica (proxy de longevidad) ---
bioage_model:
  target_col: age
  min_age: 18                 # solo adultos
  required_features:          # biomarcadores mínimos exigidos por fila
    - bmi
    - bp_systolic_mean
  features:
    - bp_systolic_mean
    - bp_diastolic_mean
    - hba1c_pct
    - glucose_mgdl
    - cholesterol_total
    - cholesterol_hdl
    - triglycerides
    - bmi
    - waist_cm
  test_size: 0.2
  random_state: 42
  n_estimators: 300
  max_depth: 12

# --- Modelo de ML: clustering no supervisado (perfiles de salud, KMeans k=4) ---
clustering_model:
  features:
    - bmi
    - age
    - bp_systolic_mean
    - bp_diastolic_mean
    - hba1c_pct
    - glucose_mgdl
    - cholesterol_total   # nombre real de la columna (LBXTC); "total_cholesterol" no existe
    - waist_cm
  n_clusters: 4
  random_state: 42

# --- Conexión a la base de datos para guardar modelos ---
# Local: SQLite (default abajo). En Docker, la variable de entorno DB_URL
# (Postgres) tiene prioridad sobre este valor (ver store_models_in_db).
db:
  url: sqlite:///data/01_raw/lab.db

# --- Fuente 3: API REST (data.cdc.gov Socrata) ---
cdc_api:
  base_url: "https://data.cdc.gov/resource"
  dataset_id: "hn4x-zwk7"   # Nutrition, Physical Activity, and Obesity
  limit: 5000
  # filtros opcionales para reducir el volumen traído
  where: "yearstart = '2018' AND question like '%obesity%'"

# Validación de esquemas (mínimo de filas esperadas por dataset crudo)
validation:
  min_rows: 1000
  drop_invalid_codes: true   # 7777/9999 = "rehúsa/no sabe" en NHANES
