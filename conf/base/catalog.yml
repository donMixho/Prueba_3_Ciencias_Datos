# Data Catalog — NHANES cardiometabólico
# https://docs.kedro.org/en/stable/catalog-data/introduction/
#
# Tres fuentes de datos:
#   1) Archivos planos (CSV)  -> demografía, examen y cuestionarios (01_raw)
#   2) Base de datos SQL      -> laboratorio (Postgres, ver credentials.yml)
#   3) API REST               -> data.cdc.gov (cargada por nodo de ingestion)

# ---------------------------------------------------------------------------
# FUENTE 1 — Archivos planos CSV (data/01_raw/nhanes_csv)
# ---------------------------------------------------------------------------
_csv: &csv
  type: pandas.CSVDataset

raw_demographics:
  <<: *csv
  filepath: data/01_raw/nhanes_csv/P_DEMO.csv

raw_body_measures:
  <<: *csv
  filepath: data/01_raw/nhanes_csv/P_BMX.csv

raw_diet:
  <<: *csv
  filepath: data/01_raw/nhanes_csv/P_DR1TOT.csv

raw_blood_pressure:
  <<: *csv
  filepath: data/01_raw/nhanes_csv/P_BPXO.csv

raw_diabetes_q:
  <<: *csv
  filepath: data/01_raw/nhanes_csv/P_DIQ.csv

raw_bloodpressure_q:
  <<: *csv
  filepath: data/01_raw/nhanes_csv/P_BPQ.csv

raw_smoking_q:
  <<: *csv
  filepath: data/01_raw/nhanes_csv/P_SMQ.csv

raw_activity_q:
  <<: *csv
  filepath: data/01_raw/nhanes_csv/P_PAQ.csv

# ---------------------------------------------------------------------------
# FUENTE 2 — Base de datos SQL (Postgres). Tablas de laboratorio.
# La conexión 'con' se define en conf/local/credentials.yml (db_lab).
# ---------------------------------------------------------------------------
_sql: &sql
  type: pandas.SQLQueryDataset
  credentials: db_lab

raw_lab_glucose:
  <<: *sql
  sql: "SELECT seqn, lbxglu FROM lab_glucose"

raw_lab_hba1c:
  <<: *sql
  sql: "SELECT seqn, lbxgh FROM lab_hba1c"

raw_lab_cholesterol:
  <<: *sql
  sql: "SELECT seqn, lbxtc, lbdhdd FROM lab_cholesterol"

raw_lab_triglycerides:
  <<: *sql
  sql: "SELECT seqn, lbxtr, lbdldl FROM lab_triglycerides"

# ---------------------------------------------------------------------------
# FUENTE 3 — API REST (se descarga en el nodo `extract_cdc_api`)
# Se persiste como snapshot para reproducibilidad.
# ---------------------------------------------------------------------------
raw_cdc_obesity_api:
  type: pandas.ParquetDataset
  filepath: data/01_raw/cdc_api/obesity_by_state.parquet
  metadata:
    note: "Snapshot de data.cdc.gov; refrescado por el pipeline de ingestion"

# ---------------------------------------------------------------------------
# CAPAS INTERMEDIAS / PRIMARIA
# ---------------------------------------------------------------------------
int_clinical_merged:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/clinical_merged.parquet

prm_cardiometabolic:
  type: pandas.ParquetDataset
  filepath: data/03_primary/cardiometabolic.parquet

# ---------------------------------------------------------------------------
# CAPA DE MODELOS — artefacto de ML (entrenado en el pipeline de processing)
# ---------------------------------------------------------------------------
risk_model:
  type: pickle.PickleDataset
  filepath: data/06_models/risk_model.pkl
  backend: pickle

bioage_model:
  type: pickle.PickleDataset
  filepath: data/06_models/bioage_model.pkl
  backend: pickle

# ---------------------------------------------------------------------------
# CAPA DE REPORTING (consumida por la API y el dashboard)
# ---------------------------------------------------------------------------
rpt_summary_by_demographics:
  type: pandas.ParquetDataset
  filepath: data/08_reporting/summary_by_demographics.parquet

rpt_prevalence:
  type: pandas.ParquetDataset
  filepath: data/08_reporting/prevalence.parquet

rpt_state_obesity:
  type: pandas.ParquetDataset
  filepath: data/08_reporting/state_obesity.parquet

rpt_nutrition_by_obesity:
  type: pandas.ParquetDataset
  filepath: data/08_reporting/nutrition_by_obesity.parquet
